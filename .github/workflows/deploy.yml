name: CI/CD Pipeline to Docker Hub & Render

on:
  push:
    branches:
      - main  # Trigger pipeline when code is pushed to the main branch

jobs:
  build-and-push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the source code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to your personal Docker Hub account
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }} # Using DOCKERHUB_PASSWORD for clarity

      # 3. Build and push the image to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6 # Updated to the latest stable action version
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartwatch-site:latest

     